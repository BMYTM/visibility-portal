<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visibility Desk</title>
<meta name="theme-color" content="#8e1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE a friendly phone app for a busy boutique owner: one thing at a time, plain words
   IDEA a bridal trousseau box: crimson lid, zari-gold trim, ivory cards inside
   PICTURE the Today screen: progress ring and today's steps as big tappable cards
   COLOUR ivory ground, bridal crimson app bar, zari gold for done, marigold for due
   TYPE Rozha One for titles, Mukta + Noto Sans Thai for text
   LAYOUT app bar, one column of cards (max 680px), bottom tab bar: Today, Plan, Write, Tools, Progress */
:root{color-scheme:light dark;--bg:light-dark(#faf6f3,#120a0d);--card:light-dark(#ffffff,#1d1115);--ink:light-dark(#1f1215,#f4ebe6);--soft:light-dark(#6b5458,#c3b0aa);--line:light-dark(#eddcd5,#36222a);--tint:light-dark(#fbf1ec,#26161b);--crim:#8e1330;--crimd:#6d0e25;--acc:light-dark(#8e1330,#e8b54e);--gold:#d9a93a;--mari:#f29f05;--onc:#fff7f0;--sh:0 1px 2px rgba(60,20,30,.06),0 4px 14px rgba(60,20,30,.06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Mukta,"Noto Sans Thai",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2{font-family:"Rozha One",Georgia,serif;font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:26px}h3{font-size:17px;margin:0;line-height:1.3}
a{color:inherit}
.bar{background:var(--crim);color:var(--onc);padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px) 16px;border-bottom:4px solid var(--gold)}
.bar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar small{display:block;font-size:13px;opacity:.85}
.bar h1{font-size:clamp(24px,6vw,32px)}
.ring{flex:none;width:58px;height:58px;position:relative;margin-left:auto}#gear+.ring{margin-left:0}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;line-height:1.05;text-align:center}
main{max-width:680px;margin:0 auto;padding:16px max(4vw,14px) 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(160deg,#fffaf5,#fbeee6);color:#1f1215;border:2px solid var(--gold)}
:root[data-theme=dark] .hero{background:linear-gradient(160deg,#2a1419,#1d1115);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{background:linear-gradient(160deg,#2a1419,#1d1115);color:var(--ink)}}
.eyebrow{font-size:14px;font-weight:700;color:var(--acc)}
.muted{color:var(--soft);font-size:14px}
.beads{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;margin-top:12px}
.beads i{height:10px;border-radius:5px;background:var(--line)}.beads i.d{background:var(--gold)}.beads i.t{background:var(--mari);outline:2px solid #fff3d6}
.sec{font-size:15px;font-weight:700;color:var(--soft);margin:18px 4px 8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
.task.due{border-left:5px solid var(--mari)}.task.done{opacity:.78}
.th{display:grid;grid-template-columns:48px minmax(0,1fr) 28px;gap:10px;align-items:center;padding:12px 12px 12px 10px;cursor:pointer}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;color:transparent;font-size:20px;font-weight:700}
.tick.on{background:var(--gold);border-color:var(--gold);color:#2a1a08}
.tick:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.task.done h3{text-decoration:line-through;text-decoration-color:var(--gold)}
.meta{font-size:13px;color:var(--soft);margin-top:2px}
.who{font-weight:700;color:var(--acc)}
.chev{width:24px;height:24px;transition:transform .2s;color:var(--soft)}
.task.open .chev{transform:rotate(180deg)}
.tb{padding:0 16px 16px;border-top:1px solid var(--line)}
.tb ol{margin:12px 0 0;padding-left:22px}.tb ol li{margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:18px;border:1px solid var(--line);background:var(--tint);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);cursor:pointer}
.chip.on{background:var(--crim);color:var(--onc);border-color:var(--crim)}
.cp{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--tint);padding:12px}
.cp b{font-size:14px}.cp pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.55 Mukta,"Noto Sans Thai",sans-serif;margin:6px 0 8px}
textarea,input,select{font:16px Mukta,"Noto Sans Thai",sans-serif;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:64px;margin-top:12px}
label{display:grid;gap:4px;font-weight:600;font-size:15px}
button{font:700 15px Mukta,"Noto Sans Thai",sans-serif;min-height:44px;padding:8px 18px;border-radius:22px;border:1.5px solid var(--crim);background:var(--crim);color:var(--onc);cursor:pointer}
button.gh{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.seg .chip{white-space:nowrap}
.form{display:grid;gap:12px}
.out pre{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.6 Mukta,"Noto Sans Thai",sans-serif;margin:8px 0 12px;min-height:80px}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font:400 30px "Rozha One",serif;line-height:1.1}.kpi span{font-size:13px;color:var(--soft)}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.pbar{height:12px;background:var(--tint);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold)}
.prow b{white-space:nowrap;font-variant-numeric:tabular-nums}
.tool{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 16px Mukta,sans-serif;color:#fff}
.tool p{margin:4px 0 0;font-size:15px}
.acct{font-size:14px;margin-top:6px}.acct b{color:var(--acc)}
.ok{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer}
.ok input{width:22px;height:22px;min-height:0;accent-color:var(--crim)}
.rule{background:var(--crim);color:var(--onc);border:0}
.rule ul{margin:8px 0 0;padding-left:20px}
.st{font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;background:var(--tint);border:1px solid var(--line);white-space:nowrap}
.st.Approved{background:var(--gold);color:#2a1a08;border-color:var(--gold)}.st.Sent{background:var(--crim);color:var(--onc);border-color:var(--crim)}
.ob{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;display:grid;gap:8px}
.ob textarea{min-height:140px;margin:0}
.hidden{display:none!important}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(60,20,30,.06)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;min-height:60px;text-decoration:none;color:var(--soft);font-size:12px;font-weight:600}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current]{color:var(--acc)}
nav.tabs a[aria-current] svg{transform:translateY(-1px)}
.sync{font-size:13px;color:var(--soft);text-align:center;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f1215;color:#fff7f0;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.chev,#toast{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="in"><div><small id="brand">Neena Sehgal · 30-day plan</small><h1 id="ttl">Today</h1></div><a id="gear" class="hidden" href="#admin" aria-label="Settings" style="color:var(--onc);display:grid;place-items:center;width:44px;height:44px;margin-left:auto"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a><div class="ring" aria-label="Steps done"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,240,230,.25)" stroke-width="4"/><circle id="rg" cx="18" cy="18" r="15" fill="none" stroke="#d9a93a" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" pathLength="100"/></svg><b id="rgt">0/23</b></div></div></header>
<main id="main"></main>
<div class="sync" id="sync">Ticks are saved on this device.</div>
<nav class="tabs" aria-label="App sections"><div class="in" id="tabs">
<a href="#today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>Today</a>
<a href="#plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14l2 2 4-4"/></svg>Plan</a>
<a href="#write"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Write</a>
<a href="#tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Tools</a>
<a href="#progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
</div></nav>
<div id="toast" role="status"></div>
<script>
{
let LIB={
masterEN:["Shop description (English)","Neena Sehgal is an Indian bridal couture boutique in Bangkok, designing bridal lehengas, sherwanis, sarees and custom wedding outfits since 1989. DS Tower 1, Soi Phrom Chit, Sukhumvit Soi 39."],
masterTH:["Shop description (Thai)","Neena Sehgal ห้องเสื้อชุดอินเดียสำหรับงานแต่งงานในกรุงเทพฯ ออกแบบชุดเจ้าสาวเลเฮงก้า ชุดเชอร์วานีเจ้าบ่าว ส่าหรี และชุดงานแต่งตัดตามสั่ง ตั้งแต่ปี 1989 อาคาร DS Tower 1 ซอยพร้อมจิต สุขุมวิท 39"],
igbio:["Instagram bio","Indian bridal couture since 1989\nLehengas · Sherwanis · Sarees · Custom\nDS Tower 1, Sukhumvit 39, Bangkok\nWhatsApp 086 086 8385 · Mon–Sat 10–6"],
fbintro:["Facebook intro","Indian bridal couture since 1989 · Lehengas, sherwanis, sarees · Sukhumvit 39, Bangkok"],
fbabout:["Facebook About (Thai)","ห้องเสื้อ Neena Sehgal ออกแบบและตัดเย็บชุดอินเดียสำหรับงานแต่งงานมาตั้งแต่ปี 1989 ทั้งชุดเจ้าสาวเลเฮงก้า ชุดเชอร์วานีเจ้าบ่าว ส่าหรี และชุดสำหรับแขกในงาน รับออกแบบตามสั่งและจัดส่งต่างประเทศ\nอาคาร DS Tower 1 ซอยพร้อมจิต สุขุมวิท 39 กรุงเทพฯ (มีที่จอดรถ)\nเปิดจันทร์–เสาร์ 10.00–18.00 น. นัดลองชุดทาง WhatsApp / โทร 086 086 8385"],
longdesc:["Long description: Google, WedMeGood, Tripadvisor","Neena Sehgal is an Indian bridal couture boutique in Bangkok, creating wedding outfits since 1989. We design and make bridal lehengas, sherwanis for grooms, sarees, anarkalis and Indo-Western looks, plus outfits for the whole wedding party. Choose a ready-to-wear piece or a fully custom bridal outfit (allow about 8 weeks). We dress brides from Bangkok's Indian community and couples planning destination weddings in Thailand, and we ship abroad. Visit our studio at DS Tower 1, Soi Phrom Chit, Sukhumvit Soi 39, with parking available. Fittings by appointment, Monday to Saturday."],
reviewEN:["Review request (English)","Hi {name}, thank you for choosing Neena Sehgal for your wedding. If you loved your outfit, a short Google review would mean a lot to our team and helps other brides find us: {Google review link}\nIf you share photos, please tag @neenasehgal_official. Thank you!"],
reviewTH:["Review request (Thai)","สวัสดีค่ะ คุณ{ชื่อ} ขอบคุณที่ไว้วางใจให้ Neena Sehgal ดูแลชุดในวันสำคัญนะคะ ถ้าประทับใจ รบกวนช่วยเขียนรีวิวสั้น ๆ บน Google ให้หน่อยนะคะ จะช่วยให้เจ้าสาวคนอื่นหาเราเจอง่ายขึ้น {ลิงก์รีวิว}\nถ้าโพสต์รูป ฝากแท็ก @neenasehgal_official ด้วยนะคะ ขอบคุณมากค่ะ"],
permission:["Real-wedding permission message","Hi {name}, your wedding looked beautiful! We'd love to share it as a 'real wedding' on WedMeGood or WeddingSutra, with your outfits credited to Neena Sehgal. May we use your photos, and could you share your photographer's name so we credit them too? Only if you're happy to. Thank you!"]
};
let TOOLS=[
{id:"portal",n:"This app",c:"#8e1330",l:"N",f:"Tick steps, write notes, get captions, approve emails, see progress.",a:"No account needed. Open the link on your phone and add it to your home screen.",cost:"Free",u:""},
{id:"instagram",n:"Instagram",c:"#c13584",l:"IG",f:"Posts, bio, Highlights, replying to DMs.",a:"Shop account @neenasehgal_official, switched to Business.",cost:"Free",u:"https://www.instagram.com/"},
{id:"mbs",n:"Meta Business Suite",c:"#1877f2",l:"M",f:"Post to Instagram and Facebook together, schedule the week's posts, one inbox for all messages, merge the two Facebook pages.",a:"The shop's own Facebook page, with the owner as admin.",cost:"Free app",u:"https://business.facebook.com/"},
{id:"gbp",n:"Google Business Profile",c:"#34a853",l:"G",f:"Address, hours, photos, review link, replying to Google reviews.",a:"The shop's own Google account that manages the listing.",cost:"Free",u:"https://business.google.com/"},
{id:"wab",n:"WhatsApp Business",c:"#25d366",l:"W",f:"Quick reply '/review' after every delivery, labels for brides, catalogue of outfits.",a:"Shop number 086 086 8385.",cost:"Free app",u:"https://business.whatsapp.com/"},
{id:"line",n:"LINE Official Account",c:"#06c755",l:"L",f:"Same review message and broadcasts, if the shop uses LINE.",a:"Shop's LINE OA (only if you already use one).",cost:"Free plan",u:"https://manager.line.biz/"},
{id:"canva",n:"Canva",c:"#00c4cc",l:"C",f:"Carousel posts, story Highlight covers, the planner lookbook.",a:"Shop's own free Canva account.",cost:"Free",u:"https://www.canva.com/"},
{id:"ai",n:"ChatGPT or Claude",c:"#10a37f",l:"AI",f:"Longer posts, ideas, Thai/English translation. In Write, press 'Copy prompt' and paste it in.",a:"The owner's own free account.",cost:"Free (paid optional)",u:"https://chatgpt.com/"},
{id:"gmail",n:"Shop email",c:"#ea4335",l:"@",f:"Send the Masala Thai pitch and the wedding-planner emails.",a:"The shop's own mailbox.",cost:"Free",u:"https://mail.google.com/"},
{id:"trip",n:"Tripadvisor",c:"#00af87",l:"T",f:"Replace the 'online garment boutique' description, set hours.",a:"Shop's Tripadvisor owner login.",cost:"Free",u:"https://www.tripadvisor.com/Owners"},
{id:"wmg",n:"WedMeGood",c:"#e72e77",l:"WG",f:"Description, new photos, ask for reviews, submit real weddings.",a:"Shop's WedMeGood vendor login.",cost:"Free basic",u:"https://www.wedmegood.com/"},
{id:"bing",n:"Bing Places",c:"#008373",l:"B",f:"Copy the Google listing to Bing — ChatGPT's web search leans on Bing.",a:"Sign in with the shop's own Microsoft or Google account.",cost:"Free",u:"https://www.bingplaces.com/"}
];
let TL=Object.fromEntries(TOOLS.map(t=>[t.id,t]));
const T=(id,d,t,m,who,tools,steps,copy=[])=>({id,d,t,m,who,tools,steps,copy});
let TASKS=[
T("t01",1,"Check the shop details",10,"You",[],["Read these five details: address DS Tower 1, Soi Phrom Chit, Sukhumvit Soi 39 · hours Monday to Saturday 10:00 to 18:00, closed Sunday · WhatsApp 086 086 8385 · in business since 1989 · about 8 weeks for a custom bridal outfit.","If anything is wrong, write the right version in the notes box below.","Tick done. Boonchoo corrects the ready text if needed."]),

T("t03",2,"Instagram: switch to a business account",10,"You",["instagram"],["Open Instagram, go to your profile and tap the menu (three lines, top right).","Tap Settings and activity, then Account type and tools, then Switch to professional account. If you see 'Professional dashboard' on your profile already, skip to step 4.","Choose Business, and pick the category Bridal shop (or Clothing store if Bridal shop isn't offered).","Tick done."]),
T("t04",2,"Instagram: new bio and contact buttons",15,"You",["instagram"],["Profile > Edit profile > Bio. Delete the old bio and paste the new one below.","In Edit profile, open Contact options: add phone 086 086 8385 (as WhatsApp if offered), the shop email and the address DS Tower 1, Sukhumvit Soi 39, Bangkok.","Save, then look at the profile from another phone to check it reads well.","Tick done."],["igbio"]),

  try{await dbr.doc('posts/'+p.id).update({caption:cap,status:b.dataset.pa,updated:new Date().toISOString()});toast(b.dataset.pa==='Posted'?'Nice — marked as posted':'Marked '+b.dataset.pa.toLowerCase())}catch(err){toast('Could not save')}return}
 if(b.dataset.ra){const c=b.closest('[data-rep]'),r=replies.find(x=>x.id==c.dataset.rep);if(!r)return;const rep=c.querySelector('[data-rf=reply]').value;
  if(b.dataset.ra==='copy')return copy(rep,b,'Copy reply');
  const ns=b.dataset.ra;
  try{await dbr.doc('replies/'+r.id).update({reply:rep,status:ns,error:'',updated:new Date().toISOString()});toast(ns==='Approved'?'Approved — it will be posted to Google within the hour':ns==='Draft'?'Back to draft':'Marked as posted')}catch(err){denied(err);toast('Could not save')}return}
 if(b.id==='wdone'){try{localStorage.setItem('ns30welcome','1')}catch(err){}render(true);return}
 if(b.id==='undo'){const f=undoFn;undoFn=null;$('toast').classList.remove('on');if(f)f();return}
 if(b.dataset.amode){collectDraft();amode=b.dataset.amode;render(true);return}
 if(b.dataset.save)return adminSave(b.dataset.save);
 if(b.id==='addtask'){collectDraft();let n=draft.tasks.length+1,id;do{id='t'+String(n++).padStart(2,'0')}while(draft.tasks.some(t=>t.id===id));draft.tasks.push({id,d:ND,t:'New step',m:10,who:'You',tools:[],steps:['Describe what to do'],copy:[]});draft.open=draft.tasks.length-1;render(true);return}
 if(b.dataset.deltask){collectDraft();draft.tasks.splice(+b.dataset.deltask,1);draft.open=null;render(true);toast('Step removed — press Save all steps to keep this');return}
 if(b.id==='addlib'){collectDraft();let k='text'+(Object.keys(draft.lib).length+1);draft.lib[k]=['New text',''];render(true);return}
 if(b.dataset.dellib){collectDraft();delete draft.lib[b.dataset.dellib];render(true);return}
 if(b.id==='addtool'){collectDraft();draft.tools.push({id:'tool'+(draft.tools.length+1),n:'New tool',c:'#555555',l:'T',f:'',a:"The business's own account.",cost:'Free',u:''});render(true);return}
 if(b.dataset.deltool){collectDraft();draft.tools.splice(+b.dataset.deltool,1);render(true);return}
 if(b.id==='x-copy')return copy($('x-out').value,b,'Copy settings');
 if(b.id==='x-def'){$('x-in').value=JSON.stringify({shop:DEFAULTS.shop,plan:DEFAULTS.plan,search:DEFAULTS.search,tasks:{items:DEFAULTS.tasks},lib:{items:DEFAULTS.lib},tools:{items:DEFAULTS.tools}},null,1);return}
 if(b.id==='sp-copy')return copy(progressText(),b,'Copy');
 if(b.id==='bk-save'){const blob=new Blob([JSON.stringify({client:CID,saved:new Date().toISOString(),local:LOCAL},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${CID}-progress-backup.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup saved to your downloads');return}
 if(b.id==='x-apply')return importAll($('x-in').value);
 if(b.id==='w-go')return write();
 if(b.id==='w-copy')return copy($('w-out').textContent,b,'Copy');
 if(b.id==='w-ask'){buildAsk();return copy(lastAsk,b,'Copy prompt for my ChatGPT')}
 if(b.id==='c-save')return saveCfg();
 if(b.id==='ob-new'){if(dbr)try{await dbr.collection('outbox').add({kind:'Other email',to:'',subject:'',body:'\n\n{signature}',status:'Draft',created:new Date().toISOString()})}catch(err){toast('Could not add')}return}
 if(b.dataset.a){const card=b.closest('[data-ob]'),o=ob.find(x=>x.id==card.dataset.ob);if(!o)return;const vals={};card.querySelectorAll('[data-f]').forEach(el=>vals[el.dataset.f]=el.value);const a=b.dataset.a;
  if(a=='copy')return copy(`To: ${vals.to}\nSubject: ${vals.subject}\n\n${(vals.body||'').replace('{signature}',sig())}`,b,'Copy email');
  const status=a=='approve'?'Approved':a=='draft'?'Draft':a=='sent'?'Sent':o.status;const {id,...rest}=o;
  try{document.activeElement.blur();await dbr.doc('outbox/'+id).set({...rest,...vals,status,updated:new Date().toISOString()});toast(a=='save'?'Saved':'Email '+status.toLowerCase())}catch(err){toast('Could not save')}}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.note){const id=t.dataset.note;st[id]={...(st[id]||{}),note:t.value};save(id);toast('Note saved')}
 if(t.dataset.pf&&dbr){const id=t.closest('[data-post]').dataset.post;dbr.doc('posts/'+id).update({caption:t.value,updated:new Date().toISOString()}).then(()=>toast('Caption saved'),()=>toast('Could not save'))}
 if(t.dataset.rf&&dbr){const id=t.closest('[data-rep]').dataset.rep;dbr.doc('replies/'+id).update({reply:t.value,updated:new Date().toISOString()}).then(()=>toast('Reply saved'),()=>toast('Could not save'))}
 if(t.id==='bk-load'&&t.files&&t.files[0]){t.files[0].text().then(x=>{const o=JSON.parse(x);if(!o||!o.local||!o.local.docs)throw 0;LOCAL=o.local;persist();refresh();render(true);toast('Progress restored')}).catch(()=>toast('That file is not a progress backup'));return}
 if(t.dataset.acc){acc={...acc,[t.dataset.acc]:t.checked};dbr.doc('config/tools').set(acc)}
});
async function copy(text,b,label){let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(err){}b.textContent=ok?'Copied':'Select the text to copy';setTimeout(()=>b.textContent=label,1800)}
async function saveCfg(){const em=$('c-email').value.trim();if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('That email address doesn’t look right');return}
 if(!dbr){toast('Sign in to save settings');return}
 try{await dbr.doc('config/email').set({shopEmail:em,senderName:$('c-name').value.trim(),signature:$('c-sig').value,provider:$('c-prov').value,mode:$('c-auto').value,status:cfg.status||'Not connected',updated:new Date().toISOString()});toast('Settings saved')}catch(err){toast('Could not save')}}
const tags={'Bridal lehenga':'#BridalLehenga','Sherwani':'#SherwaniBangkok','Saree':'#SareeBangkok','Anarkali':'#Anarkali','Indo-Western outfit':'#IndoWestern','Wedding guest outfit':'#WeddingGuestLook',"Kids' outfit":'#KidsEthnicWear'};
const tplCap=(k,d,w,o,l)=>{const S=SHOP;const en=`${k}${d?' in '+d:''}, made for ${w}${o?' for the '+o:''} in ${S.city}.\nMade in our ${S.area} studio${S.leadTime?`; custom orders take ${S.leadTime}`:''}.\nBook a fitting: WhatsApp ${S.whatsapp}\n${tags[k]||''} ${S.hashtags}`;const th=`${k}${d?' ('+d+')':''} ตัดเย็บที่ ${S.name} ${S.area} ${S.city}\nนัดลองชุด WhatsApp ${S.whatsapp}`;return l=='Thai'?th:l=='English'?en:en+'\n\n'+th};
const tplRev=(s,l)=>{const good=Number(s)>=4;const en=good?`Thank you so much for your kind words! It was a joy to serve you, and we hope to see you again at ${SHOP.name}, ${SHOP.area}.`:`Thank you for your feedback, and we are sorry it was not the experience you expected. Please message us on WhatsApp ${SHOP.whatsapp} so we can make it right.`;const th=good?`ขอบคุณมากสำหรับรีวิวดี ๆ นะคะ หวังว่าจะได้พบกันอีกที่ ${SHOP.name} ค่ะ`:`ขอบคุณสำหรับความคิดเห็นค่ะ ขออภัยที่ยังไม่เป็นอย่างที่คาดหวัง รบกวนติดต่อเราทาง WhatsApp ${SHOP.whatsapp} เพื่อให้เราได้แก้ไขให้นะคะ`;return l=='Thai'?th:l=='English'?en:en+'\n\n'+th};
let fall='';
function buildAsk(){const l=$('w-lang').value;
 if(wmode=='cap'){const k=$('w-kind').value,d=$('w-det').value.trim(),w=$('w-who').value,o=$('w-occ').value.trim();fall=tplCap(k,d,w,o,l);lastAsk=`Write one Instagram caption for ${SHOP.name}, a ${SHOP.type} at ${SHOP.address}${SHOP.since?', in business since '+SHOP.since:''}. Language: ${l} (if both, English first then Thai). Photo shows: ${k}; colour, fabric and details: ${d||'not given'}; made for ${w}; occasion: ${o||'not given'}. Line 1 says plainly what it is, for whom and that it was made in ${SHOP.city}. Line 2 gives one detail using only the facts given. Line 3 exactly: Book a fitting: WhatsApp ${SHOP.whatsapp}. Then 4 hashtags from: ${SHOP.hashtags}. Under 60 words per language. Warm, no exaggeration, no invented facts, no emoji. Return only the caption.`}
 else{const r=$('r-text').value.trim(),s=$('r-stars').value;fall=tplRev(s,l);lastAsk=`Write a short reply from ${SHOP.name}, a ${SHOP.type} in ${SHOP.city}, to this ${s}-star review: """${r}""". Language: ${l} (if both, English first then Thai, polite ค่ะ). 2 to 3 sentences, warm and personal, mention something specific from the review. If 3 stars or fewer, apologise calmly and invite them to WhatsApp ${SHOP.whatsapp}. No invented facts. Return only the reply.`}}
async function write(){
 buildAsk();$('w-out').textContent='Writing…';$('w-src').textContent='';
 lastOut=fall;$('w-out').textContent=fall;$('w-src').innerHTML='Written from the standard template. For a more personal version press <b>Copy prompt for my ChatGPT</b> and paste it into <a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>.';
}
const CID=(new URLSearchParams(location.search).get('c')||(location.pathname.match(/\/clients\/([\w-]+)\//)||[])[1]||'neena').replace(/[^\w-]/g,'');
const LKEY='vd:'+CID;let LOCAL={docs:{}},REMOTE={};
try{LOCAL=JSON.parse(localStorage.getItem(LKEY)||'{"docs":{}}');if(!LOCAL.docs)LOCAL.docs={}}catch(e){LOCAL={docs:{}}}
try{if(new URLSearchParams(location.search).get('admin')==='1')localStorage.setItem('vd:owner','1');owner=localStorage.getItem('vd:owner')==='1'}catch(e){}
const persist=()=>{try{localStorage.setItem(LKEY,JSON.stringify(LOCAL))}catch(e){toast('Phone storage is full — save a backup')}};
const coll=n=>{const out={};(REMOTE[n]||[]).forEach(d=>{if(d&&d.id)out[d.id]={...d}});for(const k in LOCAL.docs){const [c,id]=k.split('/');if(c===n)out[id]={...(out[id]||{id}),...LOCAL.docs[k],id}}return Object.values(out)};
const docOf=p=>{const [c,id]=p.split('/');const r=(REMOTE[c]||[]).find(d=>d.id===id)||(REMOTE.doc&&REMOTE.doc[p])||{};return {...r,...(LOCAL.docs[p]||{})}};
function refresh(){
 st={};coll('progress').forEach(d=>st[d.id]={done:!!d.done,note:d.note||'',at:d.at});
 checks=coll('checks');posts=coll('posts');replies=coll('replies');ob=coll('outbox');
 cfg=docOf('config/email');integ={};acc={...docOf('config/tools')};delete acc.id;
 const n={};['shop','plan','search','tasks','lib','tools'].forEach(k=>{const r=REMOTE.settings&&REMOTE.settings[k],l=LOCAL.docs['settings/'+k];if(r||l)n[k]={...(r||{}),...(l||{})}});SET=n;applySettings();
}
dbr={doc:p=>({set:async d=>{LOCAL.docs[p]={...d};persist();refresh();render()},update:async d=>{LOCAL.docs[p]={...docOf(p),...d};delete LOCAL.docs[p].id;persist();refresh();render()}}),collection:n=>({add:async d=>{const id='l'+Date.now().toString(36);LOCAL.docs[n+'/'+id]=d;persist();refresh();render();return{id}}})};
$('gear').classList.toggle('hidden',!owner);
refresh();route();
(async()=>{
 const get=async f=>{try{const r=await fetch(`clients/${CID}/${f}?v=${Date.now()}`,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}};
 const [conf,data]=await Promise.all([get('config.json'),get('data.json')]);
 if(!conf&&!data){setSync(false)}
 REMOTE={settings:conf||{},...(data||{})};refresh();render();setSync(true);
})();
}
